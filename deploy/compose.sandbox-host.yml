# Helpers for the SANDBOX HOST (the machine whose Docker daemon runs the checks).
# Creates the internal dependency-fetch network and the registry egress proxy.
#
#   docker compose -f deploy/compose.sandbox-host.yml up -d
#
# Then configure UnboxAnyRepo with:
#   UNBOX_FETCH_NETWORK=unbox-fetch
#   UNBOX_FETCH_PROXY_URL=http://unbox-egress:3128
#
# Review before use. The proxy logic is covered by unit tests and its network
# isolation was checked manually with Docker; this exact compose file has not
# been run in CI. Pin the image by digest in production.
name: unbox-sandbox

networks:
  unbox-fetch:
    name: unbox-fetch
    internal: true          # no route out; install containers can reach only the proxy
  unbox-egress:
    name: unbox-egress-out

services:
  egress-proxy:
    image: node:24-bookworm-slim
    command: ["node", "/app/src/egress-proxy/main.ts"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      UNBOX_EGRESS_PORT: "3128"
      # UNBOX_EGRESS_ALLOWLIST: "registry.npmjs.org,pypi.org,files.pythonhosted.org,proxy.golang.org,sum.golang.org,index.crates.io,static.crates.io"
    volumes:
      - ../src:/app/src:ro
    networks:
      unbox-fetch:
        aliases: [unbox-egress]
      unbox-egress: {}
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
